server {
  listen 80;
  server_name _;
  client_max_body_size 12m;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; connect-src 'self' https://ads-twitter.com https://ads-api.twitter.com https://analytics.twitter.com https://www.google-analytics.com https://region1.google-analytics.com; img-src 'self' data: blob: https://ads-twitter.com https://ads-api.twitter.com https://analytics.twitter.com https://t.co https://www.google-analytics.com; style-src 'self' 'unsafe-inline'; script-src 'self' https://static.ads-twitter.com https://www.googletagmanager.com;" always;
  # The backend and its private data are never part of the public image. Keep
  # these deny rules as defense in depth so a stale image cannot expose them.
  location ^~ /generator/ { return 404; }
  location ~ /\.(?!well-known(?:/|$)) { deny all; }
  location ~* \.(?:env|db|sqlite|sqlite3|bak|backup)$ { deny all; }
  # Backend modules must never be served by the public Nginx container.
  location ~* \.mjs$ { return 404; }
  location /api/ {
    proxy_pass http://generator-api:3002;
    proxy_http_version 1.1;
    # Image providers can legitimately take longer than Nginx's 60s default.
    # Keep the request open long enough for the backend to return a definitive
    # success/failure so a paid generation is not completed after the browser
    # has already received a gateway timeout.
    proxy_connect_timeout 10s;
    proxy_send_timeout 30s;
    proxy_read_timeout 180s;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Host $http_host;
    # Traefik terminates TLS. Forward its protocol signal to the API so it can
    # enforce HTTPS-only authentication. The web container is not exposed
    # directly to the public network in production.
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }
  location = /robots.txt {
    default_type text/plain;
    try_files $uri =404;
  }
  location = /sitemap.xml {
    default_type application/xml;
    try_files $uri =404;
  }
  location / { try_files $uri $uri/ /index.html; }
  location ~* \.(?:css|png|jpg|jpeg|webp|svg|woff2)$ { add_header Cache-Control "public, max-age=86400"; }
  location ~* \.js$ { add_header Cache-Control "no-store"; }
}
